    <script>
      (function() {
        try {
          var rawFetch = window.fetch;
          var _storedFetch = typeof rawFetch === 'function' ? rawFetch.bind(window) : rawFetch;

          function applyFetchShim(target) {
            if (!target || target === Object.prototype || target === EventTarget.prototype) return;
            try {
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (!desc || desc.configurable || (desc.get && !desc.set)) {

                    return _storedFetch;

                  set: function(newFetch) {

                  }

          }

          applyFetchShim(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            applyFetchShim(Window.prototype);

        function isExtensionError(eventOrMsg, source, lineno, colno, err) {
          var src = source || (eventOrMsg && eventOrMsg.filename) || '';
          var msg = (typeof eventOrMsg === 'string' ? eventOrMsg : (eventOrMsg && eventOrMsg.message)) || '';
          var stack = (err && err.stack) || (eventOrMsg && eventOrMsg.error && eventOrMsg.error.stack) || '';
          
          if (typeof src === 'string' && (src.indexOf('chrome-extension://') !== -1 || src.indexOf('moz-extension://') !== -1)) {
            return true;
          }
          if (typeof stack === 'string' && (stack.indexOf('chrome-extension://') !== -1 || stack.indexOf('moz-extension://') !== -1)) {
            return true;
          }
          if (typeof msg === 'string' && (msg.indexOf('Cannot set property fetch') !== -1 || msg.indexOf('which has only a getter') !== -1)) {
            return true;
          }
          return false;
        }

        window.addEventListener('error', function(e) {
          if (isExtensionError(e, e.filename, e.lineno, e.colno, e.error)) {
            e.preventDefault();
            e.stopPropagation();
            if (typeof e.stopImmediatePropagation === 'function') {
              e.stopImmediatePropagation();
            }
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason;
          if (isExtensionError(reason && reason.message, '', 0, 0, reason)) {
            e.preventDefault();
            e.stopPropagation();
            if (typeof e.stopImmediatePropagation === 'function') {

        window.onerror = function(msg, source, lineno, colno, err) {
